<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="description" content="Neuro Symbolic Tutor: a neuro-symbolic adaptive learning platform that finds your knowledge gaps and explains what to learn next." />
    <title>Neuro Symbolic Tutor</title>
    <link rel="stylesheet" href="/src/styles/brand.css" />
    <script>
      // Pre-paint theme: avoids a flash of the wrong theme. Mirrors src/app/providers/ThemeProvider.
      (function () {
        try {
          var pref = localStorage.getItem('neurotutor_theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          if (localStorage.getItem('neurotutor_reduce_motion') === 'true') root.classList.add('reduce-motion');
          // Same-tab reload: keep the splash hidden unless boot turns out to be slow (BootGate decides).
          if (sessionStorage.getItem('nt_booted')) root.classList.add('nt-quick');
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <style>
      /* Instant boot splash: pure CSS, painted before any JavaScript runs. The React BootGate
         takes it over (same mark, same position) and removes it. */
      html { background: #F7F8FB; }
      html.dark { background: #0B1020; }
      #nt-splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 28px; padding-bottom: 8px; background: #F7F8FB; color: #0F1426; font-family: system-ui, sans-serif; }
      html.dark #nt-splash { background: #0B1020; color: #E8ECF8; }
      #nt-splash .nt-splash-name { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
      #nt-splash .nt-splash-name span { color: #4F46E5; }
      html.dark #nt-splash .nt-splash-name span { color: #818CF8; }
      #nt-splash .nt-splash-slot { height: 44px; }
      html.nt-quick #nt-splash { visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="nt-splash" aria-hidden="true">
      <svg class="nt-mark" data-motion="pulse" width="72" height="72" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="nt-mark-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0d9488"/></linearGradient></defs>
        <rect width="64" height="64" rx="16" fill="url(#nt-mark-gradient)"/>
  <g fill="#fff">
    <path d="M31 12.5C27.5 8.5 19.5 10.5 19.5 17.5C15.5 19.5 15.5 26.5 20 28.5C21 33.5 28 35.5 31 31.5Z" fill-opacity=".16" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M33 12.5C36.5 8.5 44.5 10.5 44.5 17.5C48.5 19.5 48.5 26.5 44 28.5C43 33.5 36 35.5 33 31.5Z" fill-opacity=".16" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
    <path d="M23 19.5 26 26.5M41 19.5 38 26.5M26 26.5H38" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.3" stroke-linecap="round"/>
    <circle class="nt-node" cx="23" cy="19.5" r="2.4"/><circle class="nt-node" cx="41" cy="19.5" r="2.4"/><circle class="nt-node" cx="26" cy="26.5" r="2.4"/><circle class="nt-node" cx="38" cy="26.5" r="2.4"/>
    <path d="M32 44.5C27 40.5 18.5 40 10.5 42.5V52C18.5 50 27 50.5 32 54.5Z" fill-opacity=".95"/>
    <path d="M32 44.5C37 40.5 45.5 40 53.5 42.5V52C45.5 50 37 50.5 32 54.5Z" fill-opacity=".78"/>
  </g>
</svg>
      <div class="nt-splash-name">Neuro Symbolic <span>Tutor</span></div>
      <div class="nt-splash-slot"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
