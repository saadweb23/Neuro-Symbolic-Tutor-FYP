<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="description" content="NeuroTutor: an adaptive Python tutor that explains why you are stuck, not just that you are." />
    <title>NeuroTutor</title>
    <link rel="stylesheet" href="/src/styles/brand.css" />
    <script>
      // Pre-paint theme: avoids a flash of the wrong theme. Mirrors src/app/providers/ThemeProvider.
      (function () {
        try {
          var pref = localStorage.getItem('neurotutor_theme') || 'system';
          var dark = pref === 'dark' || (pref === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          if (localStorage.getItem('neurotutor_reduce_motion') === 'true') root.classList.add('reduce-motion');
          // Same-tab reload: keep the splash hidden unless boot turns out to be slow (BootGate decides).
          if (sessionStorage.getItem('nt_booted')) root.classList.add('nt-quick');
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <style>
      /* Instant boot splash: pure CSS, painted before any JavaScript runs. The React BootGate
         takes it over (same mark, same position) and removes it. */
      html { background: #F7F8FB; }
      html.dark { background: #0B1020; }
      #nt-splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 28px; padding-bottom: 8px; background: #F7F8FB; color: #0F1426; font-family: system-ui, sans-serif; }
      html.dark #nt-splash { background: #0B1020; color: #E8ECF8; }
      #nt-splash .nt-splash-name { font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
      #nt-splash .nt-splash-name span { color: #4F46E5; }
      html.dark #nt-splash .nt-splash-name span { color: #818CF8; }
      #nt-splash .nt-splash-slot { height: 44px; }
      html.nt-quick #nt-splash { visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="nt-splash" aria-hidden="true">
      <svg class="nt-mark" data-motion="pulse" width="72" height="72" viewBox="0 0 64 64" aria-hidden="true">
        <defs><linearGradient id="nt-mark-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#0d9488"/></linearGradient></defs>
        <rect width="64" height="64" rx="16" fill="url(#nt-mark-gradient)"/>
        <path d="M20 44V20L44 44V20" fill="none" stroke="#fff" stroke-opacity=".92" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
        <g fill="#fff"><circle class="nt-node" cx="20" cy="44" r="5.5"/><circle class="nt-node" cx="20" cy="20" r="5.5"/><circle class="nt-node" cx="44" cy="44" r="5.5"/><circle class="nt-node" cx="44" cy="20" r="5.5"/></g>
      </svg>
      <div class="nt-splash-name">Neuro<span>Tutor</span></div>
      <div class="nt-splash-slot"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
